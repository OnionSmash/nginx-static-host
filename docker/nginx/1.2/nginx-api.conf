# ── api.stacklume.cloud ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.stacklume.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.stacklume.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.stacklume.cloud;

    # Wildcard cert covers *.stacklume.cloud
    ssl_certificate     /etc/letsencrypt/live/stacklume.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stacklume.cloud/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://stacklume.cloud;" always;

    # Serve the API developer hub static pages
    root  /usr/share/nginx/html/api;
    index index.html;

    # CORS headers for API documentation page (adjust origin in production)
    add_header Access-Control-Allow-Origin  "https://stacklume.cloud" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS"             always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
