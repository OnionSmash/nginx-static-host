# docker-compose.yml – local development stack for demo.stacklume.cloud
# Usage:  cp .env.example .env   # fill in OPENAI_API_KEY
#         docker compose up --build
#
# Services:
#   nginx    – serves static frontend on http://localhost:8080
#              proxies /api/* to the backend
#   backend  – FastAPI RAG service on http://localhost:8000
#   chroma   – ChromaDB vector store (persistent) on http://localhost:8001

services:

  # ── ChromaDB vector store ──────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:0.5.0
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI RAG backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── nginx static + proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./docker/nginx/1.1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data:
