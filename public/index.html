<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacklume – AI-Powered Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; font-weight: 700; color: #7c3aed; }
    p  { color: #94a3b8; font-size: 1.1rem; text-align: center; max-width: 480px; }
    .chat-box {
      width: 100%;
      max-width: 640px;
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    #messages {
      min-height: 120px;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg { padding: 0.6rem 1rem; border-radius: 0.5rem; font-size: 0.95rem; }
    .msg.user { background: #7c3aed; align-self: flex-end; max-width: 80%; }
    .msg.ai   { background: #334155; align-self: flex-start; max-width: 90%; }
    .input-row { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1.2rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <h1>Stacklume AI</h1>
  <p>Ask anything about your documents. Powered by RAG + GPT.</p>

  <div class="chat-box">
    <div id="messages"></div>
    <div class="input-row">
      <input id="question" type="text" placeholder="Ask a question…" />
      <button onclick="ask()">Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input    = document.getElementById('question');

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function ask() {
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      addMsg(q, 'user');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q }),
        });
        const data = await res.json();
        addMsg(data.answer || data.detail || 'No response', 'ai');
      } catch (err) {
        addMsg('Error: ' + err.message, 'ai');
      }
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
  </script>
</body>
</html>
